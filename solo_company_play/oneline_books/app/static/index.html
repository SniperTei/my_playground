<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>一句话账本</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --ink: #1a1d24; --sub: #7a7f8c;
    --brand: #2563eb; --brand-weak: #eff4ff; --ok: #16a34a; --bad: #dc2626;
    --line: #e6e8ee; --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); font-size: 15px;
    max-width: 520px; margin: 0 auto; min-height: 100dvh; padding-bottom: 72px;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px; display: flex; align-items: baseline; gap: 8px;
  }
  header h1 { font-size: 18px; }
  header span { font-size: 12px; color: var(--sub); }
  main { padding: 14px; }
  .tab { display: none; }
  .tab.active { display: block; }
  nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 520px; background: var(--card);
    border-top: 1px solid var(--line); display: flex;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; border: none; padding: 8px 0 10px;
    font-size: 12px; color: var(--sub); cursor: pointer;
  }
  nav button .ico { font-size: 20px; display: block; margin-bottom: 2px; }
  nav button.active { color: var(--brand); font-weight: 600; }

  .box { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; border: 1px solid var(--line); }
  .saybar { display: flex; gap: 8px; align-items: stretch; }
  textarea {
    flex: 1; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; font-size: 16px; font-family: inherit; resize: none; background: var(--bg);
  }
  textarea:focus { outline: 2px solid var(--brand); background: #fff; }
  .mic {
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
    font-size: 22px; width: 52px; cursor: pointer; flex: none;
  }
  .mic.rec { background: #fee2e2; border-color: var(--bad); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .6; } }
  .btn {
    display: block; width: 100%; border: none; border-radius: 10px;
    padding: 13px; font-size: 16px; font-weight: 600; cursor: pointer;
    background: var(--brand); color: #fff;
  }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: var(--brand-weak); color: var(--brand); }
  .btn.danger { background: #fff; color: var(--bad); border: 1px solid var(--bad); font-weight: 500; font-size: 13px; padding: 6px 12px; width: auto; }
  .hint { font-size: 12px; color: var(--sub); margin-top: 8px; line-height: 1.6; }
  .err { color: var(--bad); font-size: 13px; margin-top: 8px; line-height: 1.6; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dcard { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 10px; font-size: 15px; background: var(--bg); font-family: inherit;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--brand); background: #fff; }

  .kv { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .kv:last-child { border-bottom: none; }
  .kv b { font-size: 16px; }
  .pos { color: var(--ok); } .neg { color: var(--bad); }
  .lines { font-size: 13px; color: var(--sub); line-height: 1.8; margin-top: 8px; }
  .entry { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: none; }
  .entry .m { display: flex; justify-content: space-between; font-size: 14px; gap: 8px; }
  .entry .d { font-size: 12px; color: var(--sub); margin-top: 3px; display: flex; justify-content: space-between; align-items: center; }
  .tag { font-size: 11px; background: var(--brand-weak); color: var(--brand); border-radius: 5px; padding: 1px 6px; margin-right: 6px; flex: none; }
  .tag.in { background: #e8f7ee; color: var(--ok); }
  .entry.voided .m, .entry.voided .d { opacity: .45; text-decoration: line-through; }
  .voidmark { font-size: 11px; color: var(--bad); background: #fef2f2; border-radius: 5px; padding: 1px 6px; }
  .amt { flex: none; font-weight: 600; }

  .chat { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 12px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; }
  .msg.ai { background: var(--card); border: 1px solid var(--line); align-self: flex-start; }
  .msg.me { background: var(--brand); color: #fff; align-self: flex-end; }
  .askbar { display: flex; gap: 8px; margin-top: 12px; }
  .askbar input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 11px; font-size: 15px; background: var(--bg); font-family: inherit; }
  .askbar button { border: none; border-radius: 10px; background: var(--brand); color: #fff; padding: 0 18px; font-size: 15px; font-weight: 600; }
  h3.sec { font-size: 13px; color: var(--sub); margin: 4px 0 8px; font-weight: 500; }
  .monthbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .monthbar input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 14px; background: var(--card); font-family: inherit; }
  .empty { text-align: center; color: var(--sub); font-size: 13px; padding: 24px 0; }

  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .bar-row .name { width: 48px; color: var(--sub); flex: none; }
  .bar-row .track { flex: 1; background: var(--bg); border-radius: 5px; height: 16px; overflow: hidden; }
  .bar-row .fill { height: 100%; border-radius: 5px; }
  .bar-row .fill.exp { background: #f59e0b; }
  .bar-row .fill.inc { background: var(--ok); }
  .bar-row .val { width: 76px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header><h1>一句话账本</h1><span>说了就记，问了就答</span></header>

<main>
  <!-- 记一笔 -->
  <section class="tab active" id="tab-record">
    <div class="box">
      <div class="saybar">
        <textarea id="say" rows="3" placeholder="说一句话，比如：&#10;午饭花了35"></textarea>
        <button class="mic" id="micBtn" onclick="toggleMic()" style="display:none" title="语音输入">🎤</button>
      </div>
      <div style="height:10px"></div>
      <button class="btn" id="parseBtn" onclick="doParse()">解析</button>
      <div class="hint">AI 先记草稿、自动分类，你确认了才入账。</div>
      <div class="err" id="parseErr"></div>
    </div>
    <div class="box" id="draftCard" style="display:none">
      <h3 class="sec" id="draftTitle">草稿 · 核对后入账（可改）</h3>
      <div id="draftList"></div>
      <div style="height:12px"></div>
      <button class="btn" id="recordBtn" onclick="doRecordAll()">全部入账</button>
      <div class="err" id="recordErr"></div>
    </div>
  </section>

  <!-- 流水 -->
  <section class="tab" id="tab-entries">
    <div class="monthbar">
      <input type="month" id="emonth" onchange="loadEntries()">
      <button class="btn ghost" style="width:auto;padding:8px 14px" onclick="document.getElementById('emonth').value='';loadEntries()">全部</button>
      <button class="btn ghost" style="width:auto;padding:8px 14px" onclick="window.open(exportUrl(), '_blank')">导出CSV</button>
    </div>
    <div class="box" id="entriesBox"><div class="empty">暂无流水</div></div>
  </section>

  <!-- 问账 -->
  <section class="tab" id="tab-ask">
    <div class="box chat" id="chatBox">
      <div class="msg ai">你好，我是记账助手。这个月哪类花得最多、跟上月比怎么样，随便问。</div>
    </div>
    <div class="askbar">
      <input id="question" placeholder="这个月哪类花得最多？" onkeydown="if(event.key==='Enter')doAsk()">
      <button onclick="doAsk()">问</button>
    </div>
  </section>

  <!-- 月报 -->
  <section class="tab" id="tab-report">
    <div class="monthbar"><input type="month" id="rmonth" onchange="loadReport()"></div>
    <div id="reportBox"></div>
  </section>
</main>

<nav>
  <button class="active" data-tab="record"><span class="ico">✏️</span>记一笔</button>
  <button data-tab="entries"><span class="ico">📋</span>流水</button>
  <button data-tab="ask"><span class="ico">💬</span>问账</button>
  <button data-tab="report"><span class="ico">📊</span>月报</button>
</nav>

<script>
const $ = id => document.getElementById(id);
const fmt = n => (n < 0 ? '-' : '') + Math.abs(n).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const CATS = {
  expense: ['餐饮','交通','购物','日用','居住','娱乐','医疗','人情','教育','通讯','其他'],
  income: ['工资','副业','理财','报销','红包','其他'],
};

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + b.dataset.tab));
  if (b.dataset.tab === 'entries') loadEntries();
  if (b.dataset.tab === 'report') loadReport();
});

const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
let drafts = [];  // [{type,category,amount,date,note,status:'new'|'dup'|'ok',warn}]
$('emonth').value = $('rmonth').value = todayStr().slice(0, 7);

function esc(s) { return String(s ?? '').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

function renderDrafts() {
  $('draftTitle').textContent = drafts.length > 1 ? `草稿 · ${drafts.length} 笔，核对后入账（可改）` : '草稿 · 核对后入账（可改）';
  $('draftList').innerHTML = drafts.map((d, i) => {
    const catOpts = cur => CATS[d.type].map(c => `<option value="${c}" ${c === cur ? 'selected' : ''}>${c}</option>`).join('');
    const status = d.status === 'ok' ? '<span class="voidmark" style="color:var(--ok);background:#f0fdf4">✅ 已入账</span>'
      : d.status === 'dup' ? `<span class="voidmark">⚠️ 疑似重复</span>` : '';
    return `<div class="dcard" style="opacity:${d.status === 'ok' ? .55 : 1}">
      ${drafts.length > 1 || d.status !== 'new' ? `<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span class="sec" style="font-size:12px;color:var(--sub)">第 ${i + 1} 笔</span>${status}</div>` : ''}
      <div class="grid">
        <div class="field"><label>类型</label>
          <select onchange="updDraft(${i},'type',this.value)">
            <option value="expense" ${d.type === 'expense' ? 'selected' : ''}>支出</option>
            <option value="income" ${d.type === 'income' ? 'selected' : ''}>收入</option>
          </select></div>
        <div class="field"><label>日期</label><input type="date" value="${esc(d.date || todayStr())}" onchange="updDraft(${i},'date',this.value)"></div>
        <div class="field"><label>分类</label><select onchange="updDraft(${i},'category',this.value)">${catOpts(d.category)}</select></div>
        <div class="field"><label>金额</label><input inputmode="decimal" value="${esc(d.amount ?? '')}" oninput="updDraft(${i},'amount',this.value === '' ? null : Number(this.value))"></div>
        <div class="field wide"><label>备注</label><input value="${esc(d.note || '')}" oninput="updDraft(${i},'note',this.value)"></div>
      </div>
      ${d.warn ? `<div class="err" style="margin-top:6px">${esc(d.warn)}</div>` : ''}
    </div>`;
  }).join('');
  updateRecordBtn();
}

function updDraft(i, field, value) {
  const d = drafts[i];
  d[field] = value;
  if (field === 'type' && !CATS[d.type].includes(d.category)) d.category = '其他';
  renderDrafts();
}

function updateRecordBtn() {
  const btn = $('recordBtn');
  const dups = drafts.filter(d => d.status === 'dup').length;
  const done = drafts.every(d => d.status === 'ok');
  btn.disabled = done;
  btn.textContent = done ? '已全部入账' : dups ? `忽略提醒，${dups} 笔仍要入账` : (drafts.length > 1 ? `全部入账（${drafts.length} 笔）` : '确认入账');
}

async function api(path, body) {
  const r = await fetch(path, body ? {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  } : undefined);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(typeof data.detail === 'string' ? data.detail : (data.detail && data.detail.message) || r.statusText); if (data.detail && typeof data.detail === 'object') err.detail = data.detail; throw err; }
  return data;
}

function exportUrl() {
  const m = $('emonth').value;
  return '/api/export' + (m ? '?month=' + m : '');
}

/* ---- 语音（能力检测，WebView 不支持就藏起来） ---- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, recording = false;
if (SR) {
  $('micBtn').style.display = '';
  recog = new SR();
  recog.lang = 'zh-CN';
  recog.interimResults = true;
  recog.continuous = false;
  recog.onresult = e => {
    let text = '';
    for (const res of e.results) text += res[0].transcript;
    $('say').value = text;
  };
  recog.onend = () => { recording = false; $('micBtn').classList.remove('rec'); };
  recog.onerror = () => { recording = false; $('micBtn').classList.remove('rec'); };
}
function toggleMic() {
  if (!recog) return;
  if (recording) { recog.stop(); return; }
  recording = true; $('micBtn').classList.add('rec');
  try { recog.start(); } catch (e) { recording = false; $('micBtn').classList.remove('rec'); }
}

/* ---- 记一笔（支持一句多笔） ---- */
async function doParse() {
  $('parseErr').textContent = ''; $('recordErr').textContent = '';
  const text = $('say').value.trim();
  if (!text) return;
  $('parseBtn').disabled = true; $('parseBtn').textContent = 'AI 正在听…';
  try {
    const d = await api('/api/parse', {text});
    if (d.error) {
      $('parseErr').textContent = '🤔 ' + (d.question || d.error);
      $('draftCard').style.display = 'none';
      return;
    }
    const list = Array.isArray(d) ? d : [d];  // 一句多笔 → 数组
    drafts = list.map(x => {
      const type = x.type === 'income' ? 'income' : 'expense';
      return {
        type,
        category: CATS[type].includes(x.category) ? x.category : '其他',
        amount: x.amount ?? null,
        date: x.date || todayStr(),  // AI 换算出的绝对日期（昨天/上周X…），没提默认今天
        note: x.note || '',
        status: 'new', warn: '',
      };
    });
    renderDrafts();
    $('draftCard').style.display = '';
    $('draftCard').scrollIntoView({behavior: 'smooth'});
  } catch (e) {
    $('parseErr').textContent = e.message;
  } finally {
    $('parseBtn').disabled = false; $('parseBtn').textContent = '解析';
  }
}

async function doRecordAll() {
  $('recordErr').textContent = '';
  $('recordBtn').disabled = true;
  const errors = [];
  for (let i = 0; i < drafts.length; i++) {
    const d = drafts[i];
    if (d.status === 'ok') continue;
    try {
      await api('/api/record', {
        draft: {type: d.type, category: d.category, amount: d.amount, note: d.note},
        date: d.date,
        force: d.status === 'dup',  // 疑似重复的这轮强制入账
      });
      drafts[i] = {...d, status: 'ok', warn: ''};
    } catch (e) {
      if (e.detail && e.detail.duplicate) {
        drafts[i] = {...d, status: 'dup', warn: e.detail.message};
      } else {
        errors.push(`第 ${i + 1} 笔：${e.message}`);
      }
    }
  }
  renderDrafts();
  $('recordErr').textContent = errors.length ? '🤔 ' + errors.join('；') : '';
  if (drafts.every(d => d.status === 'ok')) {
    $('say').value = '';
    setTimeout(() => { $('draftCard').style.display = 'none'; drafts = []; }, 1200);
  } else {
    $('recordBtn').disabled = false;
  }
}

/* ---- 流水 ---- */
async function loadEntries() {
  const m = $('emonth').value;
  const list = await api('/api/entries' + (m ? '?month=' + m : ''));
  const box = $('entriesBox');
  if (!list.length) { box.innerHTML = '<div class="empty">暂无流水</div>'; return; }
  box.innerHTML = list.map(e => {
    const d = e.draft || {};
    const isIn = d.type === 'income';
    const amount = d.type ? (isIn ? '+' : '-') + fmt(d.amount || 0) : '';
    const amtHtml = d.type ? `<span class="amt ${isIn ? 'pos' : 'neg'}">${amount}</span>` : '';
    const btn = (d.type && !e.voided && !e.ref_id.startsWith('void-'))
      ? `<button class="btn danger" onclick="doVoid(${e.id}, '${(e.memo || '').replace(/'/g, "\\'")}')">作废</button>` : '';
    const mark = e.voided ? '<span class="voidmark">已作废</span>'
      : (e.ref_id.startsWith('void-') ? '<span class="voidmark">作废冲销</span>' : '');
    return `<div class="entry ${e.voided ? 'voided' : ''}">
      <div class="m"><span><span class="tag ${isIn ? 'in' : ''}">${e.date}</span>${e.memo}</span>${amtHtml}</div>
      <div class="d"><span>${mark}${d.category ? '#' + d.category + '　' : ''}${e.lines.map(l => `${l.account} ${l.debit ? '↑' + fmt(l.debit) : '↓' + fmt(l.credit)}`).join('　')}</span>${btn}</div>
    </div>`;
  }).join('');
}

async function doVoid(id, memo) {
  if (!confirm(`作废这笔？\n${memo}\n（不删历史，自动记一笔反转冲销）`)) return;
  try {
    await api(`/api/void/${id}`, {});
    loadEntries();
  } catch (e) {
    alert('作废失败：' + e.message);
  }
}

/* ---- 问账（多轮） ---- */
let history = [];
async function doAsk() {
  const q = $('question').value.trim();
  if (!q) return;
  const box = $('chatBox');
  box.insertAdjacentHTML('beforeend', `<div class="msg me">${q.replace(/</g, '&lt;')}</div>`);
  $('question').value = '';
  box.insertAdjacentHTML('beforeend', '<div class="msg ai" id="thinking">算一下…</div>');
  box.scrollTop = box.scrollHeight;
  try {
    const r = await api('/api/ask', {question: q, month: $('rmonth').value || null, history});
    $('thinking').textContent = r.answer;
    history.push({role: 'user', content: q}, {role: 'assistant', content: r.answer});
    if (history.length > 16) history = history.slice(-16);
  } catch (e) {
    $('thinking').textContent = '出错了：' + e.message;
  }
  box.scrollTop = box.scrollHeight;
}

/* ---- 月报 ---- */
async function loadReport() {
  const r = await api('/api/report?month=' + $('rmonth').value);
  const bars = (obj, cls) => {
    const items = Object.entries(obj).sort((a, b) => b[1] - a[1]);
    if (!items.length) return '<div class="empty">无</div>';
    const max = items[0][1];
    return items.map(([k, v]) => `<div class="bar-row">
      <span class="name">${k}</span>
      <span class="track"><span class="fill ${cls}" style="width:${Math.max(4, v / max * 100)}%"></span></span>
      <span class="val">${fmt(v)}</span>
    </div>`).join('');
  };
  const mom = r.last_month.net !== 0 || r.mom_diff !== r.net
    ? `（上月净收支 ${fmt(r.last_month.net)}，${r.mom_diff >= 0 ? '多' : '少'}收 ${fmt(Math.abs(r.mom_diff))}）` : '';
  $('reportBox').innerHTML = `
    <div class="box">
      <h3 class="sec">${r.month} 收支</h3>
      <div class="kv"><span>收入</span><b class="pos">${fmt(r.income)}</b></div>
      <div class="kv"><span>支出</span><b class="neg">${fmt(r.expense)}</b></div>
      <div class="kv"><span>净收支</span><b class="${r.net >= 0 ? 'pos' : 'neg'}">${fmt(r.net)}</b></div>
      <div class="kv"><span>环比上月</span><b class="${r.mom_diff >= 0 ? 'pos' : 'neg'}">${mom ? fmt(r.mom_diff) : '—'}</b></div>
    </div>
    <div class="box"><h3 class="sec">现金余额（累计）</h3><div class="kv"><span>现金</span><b>${fmt(r.cash)}</b></div></div>
    <div class="box"><h3 class="sec">支出分类</h3>${bars(r.categories.expense, 'exp')}</div>
    <div class="box"><h3 class="sec">收入分类</h3>${bars(r.categories.income, 'inc')}</div>`;
}
</script>
</body>
</html>
